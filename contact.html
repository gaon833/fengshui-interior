<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — 풍수 인테리어</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="subpages.css">
</head>
<body class="sub-page">
  <header class="sub-header">
    <a href="index.html" class="sub-brand" data-site-name>풍수 인테리어</a>
    <a href="index.html" class="sub-back">← main</a>
  </header>
  <main class="editorial-page">
    <p class="section-label">CONTACT US</p>
    <h1 id="contactTitle">Contact us</h1>
    <div class="contact-grid">
      <div><span>Tel</span><p id="phone"></p></div>
      <div><span>Email</span><p id="email"></p></div>
      <div><span>Address</span><p id="address"></p></div>
    </div>
    <p id="contactMessage" class="lead small"></p>
  </main>
  <script src="content.js"></script>
  <script>
    loadJSON('/content/contact.json').then(data => {
      document.getElementById('contactTitle').textContent = data.title || 'Contact us';
      document.getElementById('phone').textContent = data.phone || '';
      document.getElementById('email').textContent = data.email || '';
      document.getElementById('address').textContent = data.address || '';
      document.getElementById('contactMessage').textContent = data.message || '';
    });
  </script>
</body>
</html>
