backend:
  name: github
  repo: gaon833/fengshui-interior
  branch: develop
  base_url: https://fengshui-interior-auth.ksh833833.workers.dev
  auth_endpoint: auth
locale: ko
publish_mode: simple
media_folder: public/assets/uploads
public_folder: /assets/uploads
collections:
  - name: homepage
    label: HOME
    files:
      - name: home
        label: 메인 페이지
        file: content/site.json
        format: json
        fields:
          - {label: 홈페이지 이름, name: siteName, widget: string}
          - {label: 메인 이미지, name: heroImage, widget: image, choose_url: false}
  - name: simple_pages
    label: 단일 이미지 페이지
    files:
      - name: about
        label: About us
        file: content/about.json
        format: json
        fields:
          - {label: 이미지, name: image, widget: image, choose_url: false}
      - name: contact
        label: Contact us
        file: content/contact.json
        format: json
        fields:
          - {label: 이미지, name: image, widget: image, choose_url: false}
  - name: work
    label: WORK
    files:
      - name: projects
        label: 프로젝트 관리
        file: content/projects.json
        format: json
        fields:
          - label: 프로젝트
            name: projects
            widget: list
            summary: "{{fields.order}} · {{fields.title}}"
            fields:
              - {label: 노출 순서, name: order, widget: number, value_type: int, min: 1}
              - {label: 프로젝트명, name: title, widget: string}
              - {label: 주소용 영문명, name: slug, widget: string, hint: "예: calm-house"}
              - {label: 분류, name: category, widget: select, options: [Residential, Commercial, Office]}
              - {label: 위치, name: location, widget: string, required: false}
              - {label: 면적, name: area, widget: string, required: false}
              - {label: 주거형태, name: housingType, widget: string, required: false}
              - {label: 가족 구성, name: family, widget: string, required: false}
              - {label: 연도, name: year, widget: string, required: false}
              - {label: 목록 대표 이미지, name: cover, widget: image, choose_url: false}
              - label: 상세 이미지
                name: gallery
                widget: list
                summary: "{{fields.orientation}} · {{fields.image}}"
                fields:
                  - {label: 이미지, name: image, widget: image, choose_url: false}
                  - {label: 사진 방향, name: orientation, widget: select, options: [{label: 가로 사진, value: landscape}, {label: 세로 사진, value: portrait}]}
